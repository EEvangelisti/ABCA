# Directory containing the experimental trajectory analysis.
# Type: existing directory path.
# Required: yes.
EXPERIMENTAL_ANALYSIS_DIR="../../experiment/trajectory_analysis"

# Indexed trajectory-analysis directory template for empirical-model
# simulations.
# Type: printf-style path template.
# Required: yes.
# The integer placeholder is expanded from SIMULATION_FROM to SIMULATION_TO.
EMPIRICAL_ANALYSIS_TEMPLATE="../../simulation_empirical/trajectory_analysis/trajectory_analysis_%03d"

# Indexed trajectory-analysis directory template for HMM simulations.
# Type: printf-style path template.
# Required: yes.
# The integer placeholder is expanded from SIMULATION_FROM to SIMULATION_TO.
HMM_ANALYSIS_TEMPLATE="../../asimulation_hmm/trajectory_analysis/trajectory_analysis_%03d"

# Path to the displacement table, relative to each trajectory-analysis
# directory.
# Type: relative file path.
# Required: yes.
DISPLACEMENT_RELATIVE_PATH="grouped_analysis/V_spatial_exploration/track_spatial_metrics.csv"

# Path to the MSD table, relative to each trajectory-analysis directory.
# Type: relative file path.
# Required: yes.
MSD_RELATIVE_PATH="grouped_analysis/V_spatial_exploration/01_msd.csv"

# Column containing net-displacement values.
# Type: string matching an input table column name.
# Required: yes.
DISPLACEMENT_COLUMN="net_displacement_µm"

# Column containing lag values in the MSD table.
# Type: string matching an input table column name.
# Required: yes.
LAG_COLUMN="lag_s"

# Column containing MSD values.
# Type: string matching an input table column name.
# Required: yes.
MSD_COLUMN="msd_µm2"

# Column used to identify independent simulations in combined tables.
# Type: string.
# Default used by the wrapper when omitted: "simulation_id".
SIMULATION_ID_COLUMN="simulation_id"

# Delimiter used to read input tables.
# Type: single-character string.
# Default used by the wrapper when omitted: ",".
DELIMITER=","

# First simulation index included in the comparison.
# Type: integer greater than or equal to 1.
# Required: yes.
SIMULATION_FROM=1

# Last simulation index included in the comparison.
# Type: integer greater than or equal to SIMULATION_FROM.
# Required: yes.
SIMULATION_TO=100

# Central percentile interval summarised across simulations.
# Type: number in ]0, 100].
# Required: yes.
# Set to 100 to retain the full simulation range.
CI_LEVEL=100

# Whether missing indexed simulations should be skipped instead of causing an
# error.
# Type: boolean-like value.
# Accepted true values: 1, true, yes, on.
# Accepted false values: 0, false, no, off.
# Default used by the wrapper when omitted: false.
ALLOW_MISSING_SIMULATIONS=false

# Directory in which comparison outputs are written.
# Type: directory path.
# Required: yes.
OUTPUT_DIR="output"

# Prefix applied to generated comparison files.
# Type: string.
# Required: yes.
OUTPUT_PREFIX="model_comparison"

# Name of the execution log written inside OUTPUT_DIR.
# Type: filename.
# Required: yes.
LOG_FILENAME="comparison.log"
