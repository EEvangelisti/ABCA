# Directory containing the experimental trajectory analysis.
# Type: existing directory path.
# Required: yes.
EXPERIMENTAL_DIR="path/to/experiment/trajectory_analysis"

# Parent directory containing independent simulation-analysis directories.
# Type: existing directory path.
# Required: yes.
SIMULATIONS_ROOT="path/to/simulation/trajectory_analysis"

# Directory in which validation figures, tables, and metadata are written.
# Type: directory path.
# Required: yes.
# The directory is created automatically if it does not already exist.
OUTPUT_DIR="../../output"

# Glob pattern used to identify independent simulation analyses inside
# SIMULATIONS_ROOT.
# Type: string containing a shell-style pattern.
# Required: yes.
SIMULATION_PATTERN="trajectory_analysis_*"

# Number of bins used for distribution comparisons.
# Type: integer greater than or equal to 2.
# Default used by the wrapper when omitted: 50.
BINS=50

# Optional upper percentile used to limit displayed histogram ranges.
# Type: number in ]0, 100] or empty string.
# Leave empty to use the complete value range.
# Default used by the wrapper when omitted: empty.
UPPER_PERCENTILE="100"

# Resolution of exported figures, in dots per inch.
# Type: positive integer.
# Default used by the wrapper when omitted: 300.
DPI=300
