# Directory containing the input TrackMate XML files.
# Type: existing directory path.
# Required: yes.
# Relative paths are resolved from the directory containing this configuration file.
XML_SOURCE="../../tracks"

# Directory in which trajectory metrics and derived tables will be written.
# Type: directory path.
# Required: yes.
# The directory is created automatically if it does not already exist.
OUTPUT_DIR="../../output/metrics"

# Time interval between two consecutive frames, in seconds.
# Type: positive number.
# Default used by the wrapper when omitted: 0.22.
FRAME_INTERVAL_S=0.07

# Multiplicative factor applied to all trajectory coordinates.
# Type: positive number.
# Use 1 when coordinates are already expressed in the desired spatial unit.
# Default used by the wrapper when omitted: 1.
COORD_SCALE=10

# Spatial unit written in output tables and figure labels.
# Type: string.
# Default used by the wrapper when omitted: "micron".
SPATIAL_UNIT="µm"

# Minimum number of detected spots required to retain a trajectory.
# Type: positive integer.
# Default used by the wrapper when omitted: 10.
MIN_SPOTS=10

# Angular threshold used to classify direction changes, in degrees.
# Type: non-negative number.
# Default used by the wrapper when omitted: 30.
DIRECTION_THRESHOLD_DEG=30

# Maximum lag used for time-lag analyses.
# Type: positive integer.
# Default used by the wrapper when omitted: 25.
MAX_LAG=25

# Trajectory-length filtering strategy.
# Type: string.
# Allowed values:
#   "percentile"  retain trajectories up to LENGTH_FILTER_PERCENTILE
#   "max_points"  retain trajectories up to LENGTH_FILTER_MAX_POINTS
#   "none"        disable trajectory-length filtering
# Default used by the wrapper when omitted: "percentile".
LENGTH_FILTER_MODE="none"

# Upper percentile retained when LENGTH_FILTER_MODE="percentile".
# Type: integer in ]0, 100].
# Default used by the wrapper when omitted: 90.
# Ignored when another filtering mode is selected.
LENGTH_FILTER_PERCENTILE=90

# Maximum number of trajectory points retained when
# LENGTH_FILTER_MODE="max_points".
# Type: positive integer when this mode is selected.
# Default used by the wrapper when omitted: 0.
# Ignored when another filtering mode is selected.
LENGTH_FILTER_MAX_POINTS=0

# Name of the subdirectory containing length-filtered outputs.
# Type: string or relative directory name.
# Default used by the wrapper when omitted: "length_filtered".
# Ignored when LENGTH_FILTER_MODE="none".
FILTERED_SUBDIR="filtered_90th_percentile"
