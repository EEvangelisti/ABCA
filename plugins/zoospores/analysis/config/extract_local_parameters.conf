# Directory containing trajectory metrics.
# Type: existing directory path.
# Required: yes.
# The directory must contain step_metrics.csv and track_metrics.csv.
METRICS_DIR="../../output/metrics"

# Directory in which exported empirical model parameters are written.
# Type: directory path.
# Default used by the wrapper when omitted:
#   <METRICS_DIR>/abca_rationale
LOCAL_PARAMETERS_DIR="../../output/abca_parameters"

# Optional central speed threshold separating SLOW and FAST states.
# Type: positive number or empty string.
# Leave empty to infer the threshold automatically from the empirical speed
# distribution.
# Default used by the wrapper when omitted: empty.
FAST_SLOW_THRESHOLD=""

# Symmetric half-width of the hysteresis band around FAST_SLOW_THRESHOLD.
# Type: non-negative integer.
# Lower threshold:
#   FAST_SLOW_THRESHOLD - HYSTERESIS_HALF_WIDTH
# Upper threshold:
#   FAST_SLOW_THRESHOLD + HYSTERESIS_HALF_WIDTH
# Default used by the wrapper when omitted: 25.
HYSTERESIS_HALF_WIDTH=25

# Maximum number of time lags used for speed and directional autocorrelation
# diagnostics.
# Type: positive integer.
# Default used by the wrapper when omitted: 25.
MAX_LAG_STEPS=25

# Number of points exported for each empirical inverse cumulative
# distribution function.
# Type: integer greater than or equal to 2.
# Default used by the wrapper when omitted: 1001.
QUANTILE_GRID_SIZE=1001

# Multiplier applied to the 90th percentile of absolute acceleration to define
# the numerical acceleration guard used by the ABCA plugin.
# Type: positive number.
# Default used by the wrapper when omitted: 3.
ACCEL_CAP_MULTIPLIER=3

# Conversion factor between physical distance and ABCA lattice cells.
# Type: positive number.
# Unit: micrometres per cell.
# Default used by the wrapper when omitted: 10.
MICRONS_PER_CELL=10
