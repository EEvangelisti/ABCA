# Directory containing the trajectory metrics generated by
# extract_trajectory_metrics.
# Type: existing directory path.
# Required: yes.
METRICS_DIR="../../output/metrics"

# Directory in which grouped analyses, figures, and summary tables are written.
# Type: directory path.
# Default used by the wrapper when omitted:
#   <METRICS_DIR>/grouped_analysis
GROUPED_ANALYSIS_DIR="../../output/grouped_analysis"

# Resolution of exported figures, in dots per inch.
# Type: positive integer.
# Default used by the wrapper when omitted: 300.
DPI=300

# Number of bins used for histogram-based analyses.
# Type: integer greater than or equal to 2.
# Default used by the wrapper when omitted: 50.
BINS=50

# Number of bins used for speed-turning coupling analyses.
# Type: integer greater than or equal to 2.
# Default used by the wrapper when omitted: 20.
COUPLING_BINS=20

# Fraction of observations used for LOWESS smoothing.
# Type: number in ]0, 1].
# Default used by the wrapper when omitted: 0.20.
SMOOTH_FRAC=0.20

# Optional speed threshold used to define behavioural states.
# Type: positive number or empty string.
# Leave empty to let the Python script infer the threshold automatically.
# Default used by the wrapper when omitted: empty.
STATE_SPEED_THRESHOLD=""
