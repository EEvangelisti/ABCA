# XML file or directory containing XML files to process.
# Type: existing file or directory path.
# Required: yes.
# Both standard TrackMate XML and ABCA-generated TrackMate variants are
# detected automatically.
XML_SOURCE="../../simulation/xml"

# Directory in which burn-in-corrected XML files are written.
# Type: directory path.
# Required: yes.
# The directory is created automatically if it does not already exist.
OUTPUT_DIR="../../simulation/xml_after_burn_in"

# Number of initial frames removed.
# Type: non-negative integer.
# Default used by the wrapper when omitted: 0.
BURN_IN_FRAMES=10

# Minimum number of spots required to retain a trajectory after burn-in.
# Type: positive integer.
# Trajectories containing fewer spots are removed entirely.
# Default used by the wrapper when omitted: 10.
MIN_REMAINING_SPOTS=10

# Reference used to calculate the burn-in threshold.
# Type: string.
# Allowed values:
#   "absolute"  remove observations with FRAME < BURN_IN_FRAMES
#               (recommended for simulation burn-in)
#   "relative"  remove BURN_IN_FRAMES from the beginning of each trajectory
# Default used by the wrapper when omitted: "absolute".
BURN_IN_MODE="absolute"

# Glob pattern used when XML_SOURCE is a directory.
# Type: string.
# Default used by the wrapper when omitted: "*.xml".
XML_PATTERN="*.xml"

# Name of the CSV processing summary written inside OUTPUT_DIR.
# Type: filename.
# Default used by the wrapper when omitted: "burn_in_summary.csv".
SUMMARY_FILENAME="burn_in_summary.csv"

# Whether output XML files should be pretty-printed.
# Type: boolean-like value.
# Accepted true values: 1, true, yes, on.
# Accepted false values: 0, false, no, off.
# Pretty printing improves readability but increases file size.
# Default used by the wrapper when omitted: false.
INDENT_XML=false
