# Directory containing trajectory metrics.
# Type: existing directory path.
# Required: yes.
# The directory must contain step_metrics.csv.
METRICS_DIR="../../output/metrics"

# Directory in which hysteresis sensitivity outputs are written.
# Type: directory path.
# Default used by the wrapper when omitted:
#   <METRICS_DIR>/fast_slow_hysteresis_sensitivity
HYSTERESIS_DIR="../../output/hysteresis_sensitivity"

# Symmetric hysteresis half-widths evaluated around the Otsu threshold.
# Type: comma-separated list of non-negative numbers.
# Units: same speed unit as step_metrics.csv.
# Default used by the wrapper when omitted:
#   "0,5,10,15,20,30,40"
HYSTERESIS_WIDTHS="0,5,10,15,20,30,40"

# Number of histogram bins used to estimate the Otsu threshold.
# Type: integer greater than or equal to 2.
# Default used by the wrapper when omitted: 256.
OTSU_BINS=256

# Number of bins used in duration, length, and speed histograms.
# Type: integer greater than or equal to 2.
# Default used by the wrapper when omitted: 50.
HISTOGRAM_BINS=50

# Resolution of exported figures, in dots per inch.
# Type: positive integer.
# Default used by the wrapper when omitted: 300.
DPI=300
