# Directory containing simulated TrackMate XML files.
# Type: existing directory path.
# Required: yes.
INPUT_DIR="../../tracks"

# Directory in which resampled XML files are written.
# Type: directory path.
# Required: yes.
# The directory is created automatically if it does not already exist.
OUTPUT_DIR="../../output/resampled"

# CSV file containing the empirical trajectory-length distribution.
# Type: existing file path.
# Required: yes.
EMPIRICAL_LENGTHS="experiment/trajectory_analysis/trajectory_overview/03_trajectory_lengths_filtered.csv"

# Maximum number of resampling jobs run in parallel.
# Type: positive integer not exceeding the number of available CPUs.
# Default used by the wrapper when omitted: one quarter of available CPUs,
# with a minimum of 1.
MAX_JOBS=5

# Random seed assigned to the first input file.
# Type: non-negative integer.
# Subsequent files receive incrementing seeds.
# Required: yes.
INITIAL_SEED=1
