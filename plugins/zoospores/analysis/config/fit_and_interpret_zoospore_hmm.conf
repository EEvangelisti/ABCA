# Directory containing trajectory metrics.
# Type: existing directory path.
# Required: yes.
# The directory must contain:
#   step_metrics.csv or step_metrics.tsv
#   turn_metrics.csv or turn_metrics.tsv
METRICS_DIR="trajectory_analysis/metrics/filtered_90th_percentile"

# Directory in which HMM fits, diagnostics, and exported parameters are written.
# Type: directory path.
# Default used by the wrapper when omitted:
#   <METRICS_DIR>/hmm_analysis
HMM_ANALYSIS_DIR="trajectory_analysis/hmm_analysis"

# Time interval between successive observations, in seconds.
# Type: positive number.
# Default used by the wrapper when omitted: 0.22.
DT=0.07

# Minimum number of hidden states evaluated.
# Type: integer greater than or equal to 2.
# Default used by the wrapper when omitted: 2.
MIN_STATES=2

# Maximum number of hidden states evaluated.
# Type: integer greater than or equal to MIN_STATES.
# Default used by the wrapper when omitted: 7.
MAX_STATES=7

# Number of independent random initializations fitted for each state count.
# Type: positive integer.
# Default used by the wrapper when omitted: 10.
INITIALIZATIONS=10

# Maximum number of expectation-maximization iterations.
# Type: positive integer.
# Default used by the wrapper when omitted: 500.
N_ITER=500

# Convergence tolerance used by hmmlearn.
# Type: positive number.
# Default used by the wrapper when omitted: 0.0001.
TOL=1e-4

# Covariance structure of Gaussian emissions.
# Type: string.
# Allowed values:
#   "diag"
#   "spherical"
#   "full"
#   "tied"
# Default used by the wrapper when omitted: "diag".
COVARIANCE_TYPE="diag"

# Minimum number of complete local observations required for a trajectory to
# be retained as an independent HMM sequence.
# Type: positive integer.
# Default used by the wrapper when omitted: 10.
MIN_TRACK_OBSERVATIONS=10

# Scale used in the transformation:
#   asinh(acceleration / ACCELERATION_SCALE)
# Type: positive number.
# Default used by the wrapper when omitted: 100.
ACCELERATION_SCALE=100

# Minimum transition probability displayed in transition graphs.
# Type: number in [0, 1].
# Self-transitions are omitted from these graphs.
# Default used by the wrapper when omitted: 0.02.
TRANSITION_GRAPH_THRESHOLD=0.02

# Minimum off-diagonal transition probability defining an active edge in the
# structural-connectivity analysis.
# Type: number in [0, 1].
# Default used by the wrapper when omitted: 0.02.
CONNECTIVITY_THRESHOLD=0.02

# Minimum decoded occupancy required for every state in a structurally
# admissible model.
# Type: number in ]0, 1].
# Default used by the wrapper when omitted: 0.01.
MINIMUM_STATE_OCCUPANCY=0.01

# Minimum mean maximum-posterior probability required for every state in a
# structurally admissible model.
# Type: number in ]0, 1].
# Default used by the wrapper when omitted: 0.50.
MINIMUM_STATE_POSTERIOR=0.50

# Maximum number of trajectories displayed in state-coloured diagnostic plots.
# Type: positive integer.
# Default used by the wrapper when omitted: 200.
MAX_TRACKS_PLOT=200

# Number of empirical quantile points exported for each decoded HMM state.
# Type: integer greater than or equal to 2.
# Default used by the wrapper when omitted: 1001.
QUANTILE_COUNT=1001

# Resolution of exported figures, in dots per inch.
# Type: positive integer.
# Default used by the wrapper when omitted: 300.
DPI=300

# Whether to write the full decoded-observation table for every tested state
# count.
# Type: boolean-like value.
# Accepted true values: 1, true, yes, on.
# Accepted false values: 0, false, no, off.
# Default used by the wrapper when omitted: 0.
WRITE_DECODED_ALL=0
