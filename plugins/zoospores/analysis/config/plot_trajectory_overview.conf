# Directory containing metrics from the length-filtered trajectory dataset.
# Type: existing directory path or empty string.
# Optional: yes.
# At least one of FILTERED_METRICS_DIR and COMPLETE_METRICS_DIR must be set.
FILTERED_METRICS_DIR=""

# Directory containing metrics from the complete trajectory dataset.
# Type: existing directory path or empty string.
# Optional: yes.
# At least one of FILTERED_METRICS_DIR and COMPLETE_METRICS_DIR must be set.
COMPLETE_METRICS_DIR="../../output/metrics"

# Directory in which overview figures and tables are written.
# Type: directory path.
# Default used by the wrapper when omitted:
#   <primary metrics directory>/trajectory_overview
# The filtered dataset is used as the primary dataset when both are provided.
OVERVIEW_DIR="../../output/trajectory_overview"

# Number of angular bins used for direction-distribution plots.
# Type: integer greater than or equal to 2.
# Default used by the wrapper when omitted: 36.
ANGULAR_BINS=36

# Maximum number of trajectories displayed in global overview plots.
# Type: non-negative integer.
# Set to 0 to display all available trajectories.
# Default used by the wrapper when omitted: 2000.
MAX_TRACKS=0

# Width of individual trajectory lines in overview plots.
# Type: positive number.
# Default used by the wrapper when omitted: 0.55.
LINE_WIDTH=0.55

# Maximum number of trajectories displayed per trajectory-length decile.
# Type: non-negative integer.
# Set to 0 to display all trajectories in each decile.
# Default used by the wrapper when omitted: 500.
MAX_TRACKS_PER_DECILE=500

# Resolution of exported figures, in dots per inch.
# Type: positive integer.
# Default used by the wrapper when omitted: 300.
DPI=300
