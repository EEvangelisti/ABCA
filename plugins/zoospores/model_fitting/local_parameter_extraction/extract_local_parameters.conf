# Input trajectory metrics.
METRICS_DIR="../../output/metrics"

# Output directory.
LOCAL_PARAMETERS_DIR="../../output/abca_parameters"

# Optional central SLOW/FAST speed threshold.
# Leave empty to let the Python script infer the threshold automatically from
# the empirical speed distribution.
FAST_SLOW_THRESHOLD=""

# Symmetric hysteresis half-width around the FAST/SLOW threshold.
# The lower threshold is:
#
#   FAST_SLOW_THRESHOLD - HYSTERESIS_HALF_WIDTH
#
# and the upper threshold is:
#
#   FAST_SLOW_THRESHOLD + HYSTERESIS_HALF_WIDTH
HYSTERESIS_HALF_WIDTH=25

# Maximum number of time lags used for descriptive speed and directional
# autocorrelation diagnostics.
MAX_LAG_STEPS=25

# Number of points exported for each empirical inverse cumulative
# distribution function.
QUANTILE_GRID_SIZE=1001

# Multiplicative factor applied to q90 of absolute acceleration to define the
# numerical acceleration guard used by the ABCA plugin.
ACCEL_CAP_MULTIPLIER=3

# Conversion between continuous physical distances and ABCA lattice cells.
MICRONS_PER_CELL=10
