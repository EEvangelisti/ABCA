# Experimental trajectory-analysis directory.
EXPERIMENTAL_ANALYSIS_DIR="../../experiment/trajectory_analysis"

# Indexed trajectory-analysis directories for the two simulation models.
# The printf placeholder is expanded from SIMULATION_FROM to SIMULATION_TO.
EMPIRICAL_ANALYSIS_TEMPLATE="../../simulation_empirical/trajectory_analysis/trajectory_analysis_%03d"
HMM_ANALYSIS_TEMPLATE="../../asimulation_hmm/trajectory_analysis/trajectory_analysis_%03d"

# Files relative to each trajectory-analysis directory.
DISPLACEMENT_RELATIVE_PATH="grouped_analysis/V_spatial_exploration/track_spatial_metrics.csv"
MSD_RELATIVE_PATH="grouped_analysis/V_spatial_exploration/01_msd.csv"

# Input table columns.
DISPLACEMENT_COLUMN="net_displacement_µm"
LAG_COLUMN="lag_s"
MSD_COLUMN="msd_µm2"
SIMULATION_ID_COLUMN="simulation_id"
DELIMITER=","

# Inclusive range of independent simulations.
SIMULATION_FROM=1
SIMULATION_TO=100

# Percentile interval summarised across simulations.
CI_LEVEL=100

# Set to true to skip missing indexed simulations instead of stopping.
ALLOW_MISSING_SIMULATIONS=false

# Output location and filenames.
OUTPUT_DIR="output"
OUTPUT_PREFIX="model_comparison"
LOG_FILENAME="comparison.log"
