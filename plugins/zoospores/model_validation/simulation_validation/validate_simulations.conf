# Experimental trajectory-analysis directory
EXPERIMENTAL_DIR="path/to/experiment/trajectory_analysis"

# Parent directory containing independent simulation-analysis directories
SIMULATIONS_ROOT="path/to/simulation/trajectory_analysis"

# Output directory for figures, tables, and comparison metadata
OUTPUT_DIR="../../output"

# Glob pattern used to identify independent simulation analyses
SIMULATION_PATTERN="trajectory_analysis_*"

# Number of bins used for distribution comparisons
BINS=50

# Optional upper display percentile used to limit histogram ranges.
# Leave empty to use the complete value range.
UPPER_PERCENTILE="100"

# Resolution of exported figures
DPI=300
